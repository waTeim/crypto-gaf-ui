# Default values for crypto-gaf-ui.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: crypto-gaf-ui
  pullPolicy: IfNotPresent
  tag: latest

# Container listens on the configured port via nginx (default: 4203).
containerPort: 4203

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: false
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext: null
securityContext: null

service:
  type: ClusterIP
  port: 4203
  targetPort: 4203
  nodePort: null
  annotations: {}
  # Example: service.beta.kubernetes.io/aws-load-balancer-type: nlb
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []

resources: {}

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

appConfig:
  apiBaseUrl: ""
  productId: BTC-USD
  productLabel: BTC
